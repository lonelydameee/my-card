<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>My Card</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
body{color:#111}
.container{min-height:100vh;padding:12px 18px max(35px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
.header{width:100%;max-width:400px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.back{font-size:30px;font-weight:300;color:#007aff;width:45px;cursor:pointer}
.title{font-size:17px;font-weight:600;text-align:center;white-space:nowrap}
.header-action{width:45px;text-align:right;color:#007aff;font-size:15px;cursor:pointer;white-space:nowrap}
.card{width:100%;max-width:400px;margin:0 auto;border-radius:20px;overflow:hidden;background:white;box-shadow:0 5px 12px rgba(0,0,0,.10),0 15px 35px rgba(0,0,0,.12);transform:translateZ(0)}
.card img{display:block;width:100%;height:auto;object-fit:contain}
.design-page{width:100%;max-width:400px;display:none}
.design-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.design-item{border:0;background:white;border-radius:16px;padding:0;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.10);cursor:pointer;text-align:center;position:relative}
.design-item img{display:block;width:100%;height:auto;aspect-ratio:1.59;object-fit:cover}
.design-name{font-size:15px;font-weight:500;padding:10px 5px 12px;min-height:40px}
.design-name.editable{cursor:text}
.add-item{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#007aff;font-size:15px;font-weight:500}
.add-icon{font-size:32px;font-weight:300;line-height:1;margin-bottom:8px}
input[type=file]{display:none}
.manage-page{width:100%;max-width:400px;display:none}
.manage-list{display:flex;flex-direction:column;gap:12px}
.manage-item{background:white;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.manage-item img{width:82px;height:52px;object-fit:cover;border-radius:8px;flex:none}
.manage-info{flex:1;min-width:0}
.manage-name{font-size:15px;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.manage-actions{display:flex;gap:8px}
.manage-actions button{border:0;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.rename-btn{background:#f2f2f7;color:#007aff}
.remove-btn{background:#fff0ef;color:#ff3b30}
.no-custom{background:white;border-radius:14px;padding:18px;text-align:center;color:#777;font-size:14px}
</style>
</head>
<body>
<div class="container">

  <div id="mainPage">
    <div class="header">
      <div class="back" onclick="showDesigns()">‹</div>
      <div class="title">My Card</div>
      <div class="header-action"></div>
    </div>
    <div class="card">
      <img id="mainCard" src="card.png" alt="My Card">
    </div>
  </div>

  <div id="designPage" class="design-page">
    <div class="header">
      <div class="back" onclick="showMain()">‹</div>
      <div class="title">カードデザイン変更</div>
      <div class="header-action" onclick="showManage()">削除</div>
    </div>

    <div class="design-grid">
      <button class="design-item" onclick="selectDesign('design1.png')">
        <img src="design1.png" alt="デザイン1">
        <div id="name-design1" class="design-name editable" onclick="renameDesign(event,'design1')">デザイン1</div>
      </button>

      <button class="design-item" onclick="selectDesign('card.png')">
        <img src="card.png" alt="デザイン2">
        <div id="name-design2" class="design-name editable" onclick="renameDesign(event,'design2')">デザイン2</div>
      </button>

      <label class="design-item add-item">
        <span class="add-icon">＋</span>
        <span>新たなデザインを追加...</span>
        <input id="photoInput" type="file" accept="image/*">
      </label>

      <div id="customItem" class="design-item custom-item" style="display:none" onclick="selectCustom()">
        <img id="customPreview" alt="追加したデザイン">
        <div id="name-custom" class="design-name editable" onclick="renameDesign(event,'custom')">追加したデザイン</div>
      </div>
    </div>
  </div>

  <div id="managePage" class="manage-page">
    <div class="header">
      <div class="back" onclick="showDesigns()">‹</div>
      <div class="title">デザインを削除</div>
      <div class="header-action"></div>
    </div>
    <div id="manageList" class="manage-list"></div>
  </div>
</div>

<script>
const mainCard=document.getElementById('mainCard');
const mainPage=document.getElementById('mainPage');
const designPage=document.getElementById('designPage');
const managePage=document.getElementById('managePage');
const photoInput=document.getElementById('photoInput');
const customItem=document.getElementById('customItem');
const customPreview=document.getElementById('customPreview');

const defaultNames={design1:'デザイン1',design2:'デザイン2'};

function getName(key,fallback){return localStorage.getItem('name_'+key)||fallback}
function setName(key,name){localStorage.setItem('name_'+key,name)}
function refreshNames(){
  document.getElementById('name-design1').textContent=getName('design1',defaultNames.design1);
  document.getElementById('name-design2').textContent=getName('design2',defaultNames.design2);
  document.getElementById('name-custom').textContent=getName('custom','追加したデザイン');
}

const saved=localStorage.getItem('selectedCard');
if(saved) mainCard.src=saved;

const customImage=localStorage.getItem('customCardImage');
if(customImage){customPreview.src=customImage;customItem.style.display='block'}
refreshNames();

function showDesigns(){
  mainPage.style.display='none';
  managePage.style.display='none';
  designPage.style.display='block';
  refreshNames();
}
function showMain(){
  designPage.style.display='none';
  managePage.style.display='none';
  mainPage.style.display='block';
}
function showManage(){
  designPage.style.display='none';
  managePage.style.display='block';
  renderManageList();
}
function selectDesign(src){
  mainCard.src=src;
  localStorage.setItem('selectedCard',src);
  showMain();
}
function selectCustom(){
  const img=localStorage.getItem('customCardImage');
  if(img){mainCard.src=img;localStorage.setItem('selectedCard',img);showMain()}
}
function renameDesign(event,key){
  event.stopPropagation();
  const fallback=key==='design1'?defaultNames.design1:key==='design2'?defaultNames.design2:'追加したデザイン';
  const current=getName(key,fallback);
  const name=prompt('デザイン名を入力してください',current);
  if(name===null)return;
  const trimmed=name.trim();
  if(!trimmed){alert('デザイン名を入力してください');return}
  setName(key,trimmed);
  refreshNames();
  renderManageList();
}
function renderManageList(){
  const list=document.getElementById('manageList');
  list.innerHTML='';
  const img=localStorage.getItem('customCardImage');
  if(!img){
    list.innerHTML='<div class="no-custom">削除できる追加デザインはありません。</div>';
    return;
  }
  const item=document.createElement('div');
  item.className='manage-item';
  item.innerHTML='<img src="'+img+'" alt=""><div class="manage-info"><div class="manage-name"></div><div class="manage-actions"><button class="rename-btn">名前を変更</button><button class="remove-btn">削除</button></div></div>';
  item.querySelector('.manage-name').textContent=getName('custom','追加したデザイン');
  item.querySelector('.rename-btn').onclick=()=>renameFromManage();
  item.querySelector('.remove-btn').onclick=()=>deleteCustom();
  list.appendChild(item);
}
function renameFromManage(){
  const current=getName('custom','追加したデザイン');
  const name=prompt('デザイン名を入力してください',current);
  if(name===null)return;
  const trimmed=name.trim();
  if(!trimmed){alert('デザイン名を入力してください');return}
  setName('custom',trimmed);
  refreshNames();
  renderManageList();
}
function deleteCustom(){
  if(!confirm('このデザインを削除しますか？'))return;
  localStorage.removeItem('customCardImage');
  localStorage.removeItem('name_custom');
  if(localStorage.getItem('selectedCard') && localStorage.getItem('selectedCard').startsWith('data:image/')){
    localStorage.setItem('selectedCard','card.png');
    mainCard.src='card.png';
  }
  customPreview.removeAttribute('src');
  customItem.style.display='none';
  renderManageList();
}

photoInput.addEventListener('change',function(){
  const file=this.files[0];
  if(!file||!file.type.startsWith('image/'))return;
  const reader=new FileReader();
  reader.onload=function(e){
    const data=e.target.result;
    localStorage.setItem('customCardImage',data);
    if(!localStorage.getItem('name_custom'))localStorage.setItem('name_custom','追加したデザイン');
    customPreview.src=data;
    customItem.style.display='block';
    mainCard.src=data;
    localStorage.setItem('selectedCard',data);
    showMain();
  };
  reader.readAsDataURL(file);
});
</script>
</body>
</html>
